<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lowkey Watermark Replica</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Orbitron:wght@900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: #030303;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Montserrat', 'Orbitron', sans-serif;
  }

  .viewport {
    position: relative;
    width: 100%;
    max-width: 720px;
    height: 480px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: #000;
    border: 2px solid #1a1a1a;
  }

  /* Volumetric Light Burst */
  .light-rays {
    position: absolute;
    width: 520px;
    height: 260px;
    background: radial-gradient(ellipse at center, 
      rgba(255, 255, 255, 0.95) 0%, 
      rgba(255, 30, 60, 0.45) 32%, 
      rgba(255, 0, 0, 0.18) 58%, 
      rgba(0,0,0,0) 75%);
    filter: blur(22px);
    z-index: 1;
    animation: rayPulse 4s infinite linear;
  }

  .text-wrapper {
    position: relative;
    z-index: 3;
    text-align: center;
    animation: creepZoom 4s infinite cubic-bezier(0.16, 1, 0.3, 1);
  }

  .subtext {
    color: #ffffff;
    font-family: 'Montserrat', sans-serif;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: -10px;
    opacity: 0;
    text-shadow: 0 0 8px rgba(255, 0, 51, 0.9), 0 0 15px rgba(255, 255, 255, 0.7);
    animation: subFade 4s infinite cubic-bezier(0.16, 1, 0.3, 1);
  }

  .maintext {
    color: #ffffff;
    font-family: 'Montserrat', 'Orbitron', sans-serif;
    font-size: 78px;
    font-weight: 900;
    letter-spacing: 2px;
    
    /* Heavy Red Stroke & Red Halo Glow */
    -webkit-text-stroke: 3px #ff0033;
    paint-order: stroke fill;
    text-shadow: 
      0 0 12px #ff0033,
      0 0 25px #ff0033,
      0 0 50px rgba(255, 0, 51, 0.85);
    
    animation: popGlitch 4s infinite cubic-bezier(0.16, 1, 0.3, 1);
  }

  canvas#particles {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
  }

  /* Animations */
  @keyframes creepZoom {
    0% { transform: scale(0.82); }
    100% { transform: scale(1.12); }
  }

  @keyframes subFade {
    0%, 20% { opacity: 0; transform: translateY(6px); }
    35%, 100% { opacity: 1; transform: translateY(0); }
  }

  @keyframes popGlitch {
    0% {
      opacity: 0;
      transform: scale(0.5);
      text-shadow: -12px 0 #ff0055, 12px 0 #00e5ff;
    }
    10% {
      opacity: 1;
      transform: scale(1.18);
      text-shadow: -8px 0 #ff0055, 8px 0 #00e5ff;
    }
    20% {
      transform: scale(0.96);
      text-shadow: 0 0 12px #ff0033, 0 0 25px #ff0033;
    }
    100% {
      opacity: 1;
      transform: scale(1);
      text-shadow: 0 0 12px #ff0033, 0 0 25px #ff0033, 0 0 50px rgba(255, 0, 51, 0.85);
    }
  }

  @keyframes rayPulse {
    0% { opacity: 0.2; transform: scale(0.5); }
    12% { opacity: 1; transform: scale(1.35); }
    30% { opacity: 0.75; transform: scale(1); }
    100% { opacity: 0.85; transform: scale(1.2); }
  }
</style>
</head>
<body>

<div class="viewport">
  <div class="light-rays"></div>
  <canvas id="particles"></canvas>
  <div class="text-wrapper">
    <div class="subtext">EDITED BY</div>
    <div class="maintext">Lowkey</div>
  </div>
</div>

<script>
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  
  function resize() {
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const particleCount = 55;
  const particles = Array.from({ length: particleCount }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: Math.random() * 3.5 + 1.2,
    speedX: (Math.random() - 0.5) * 1.8,
    speedY: (Math.random() - 0.5) * 1.8,
    alpha: Math.random() * 0.7 + 0.3
  }));

  let startTime = Date.now();

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let elapsed = ((Date.now() - startTime) % 4000) / 1000;

    // Exact Particle Sequence Timeline:
    // 0.0s - 1.0s: Gold / Yellow
    // 1.0s - 2.0s: Bright Green
    // 2.0s - 3.0s: Purple
    // 3.0s - 4.0s: Red
    let color = { r: 255, g: 215, b: 0 }; // Gold (00:00)

    if (elapsed >= 1.0 && elapsed < 2.0) {
      color = { r: 0, g: 255, b: 128 }; // Green (00:01)
    } else if (elapsed >= 2.0 && elapsed < 3.0) {
      color = { r: 180, g: 70, b: 255 }; // Purple (00:02)
    } else if (elapsed >= 3.0) {
      color = { r: 255, g: 30, b: 60 }; // Red (00:03)
    }

    particles.forEach(p => {
      p.x += p.speedX;
      p.y += p.speedY;

      if (p.x < 0) p.x = canvas.width;
      if (p.x > canvas.width) p.x = 0;
      if (p.y < 0) p.y = canvas.height;
      if (p.y > canvas.height) p.y = 0;

      ctx.fillStyle = `rgba(${color.r}, ${color.g}, ${color.b}, ${p.alpha})`;
      ctx.shadowBlur = 8;
      ctx.shadowColor = `rgb(${color.r}, ${color.g}, ${color.b})`;
      
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });

    requestAnimationFrame(animate);
  }

  animate();
</script>

</body>
</html>
